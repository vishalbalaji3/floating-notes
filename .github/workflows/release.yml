name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v1.2.3" >&2
            exit 1
          fi
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh

      - name: Create signed update archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "${SPARKLE_PRIVATE_KEY}" ]]; then
            echo "The SPARKLE_PRIVATE_KEY repository secret is required." >&2
            exit 1
          fi

          archive="Floating-Notes-${APP_VERSION}.zip"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "build/Floating Notes.app" "release/${archive}"

          printf '%s' "${SPARKLE_PRIVATE_KEY}" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --account com.vishalbalaji.floatingnotes \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --maximum-deltas 0 \
              -o "${PWD}/release/appcast.xml" \
              release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/Floating-Notes-${APP_VERSION}.zip" \
            "release/appcast.xml" \
            --title "Floating Notes ${APP_VERSION}" \
            --generate-notes
